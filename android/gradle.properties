org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# KSP (Room) todavía registra sus directorios generados vía el DSL viejo de
# Kotlin source sets, que el "built-in Kotlin" de AGP 9 rechaza por defecto —
# ver https://developer.android.com/r/tools/built-in-kotlin. Mientras KSP no se
# actualice, se permite explícitamente.
android.disallowKotlinSourceSets=false
